{% extends "base.html" %}
{% block title %}404 — Page Not Found | QFIFA{% endblock %}
{% block content %}
<div style="min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:48px 24px;">
  <div>
    <div style="font-size:72px;margin-bottom:16px;opacity:.6;">🏟️</div>
    <h1 style="font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:800;color:var(--color-primary);">404</h1>
    <h2 style="font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:8px 0 12px;">Page Not Found</h2>
    <p style="color:var(--color-text-muted);margin-bottom:24px;max-width:400px;">The page you're looking for doesn't exist or has been moved.</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <a href="{{ url_for('dashboard.index') }}" class="mq-btn mq-btn--primary">Go to Dashboard</a>
      <a href="{{ url_for('matches.matches') }}" class="mq-btn mq-btn--outline">View Matches</a>
    </div>
  </div>
</div>
{% endblock %}
